# Blue 환경 정의
upstream blue {
    server blue-container:8080;  # Blue 컨테이너의 IP 및 포트
}

# Green 환경 정의
upstream green {
    server green-container:8080;  # Green 컨테이너의 IP 및 포트
}

server {
    listen 80;
    server_name manchui.shop;

    # HTTP를 HTTPS로 리디렉션
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name manchui.shop;

    # SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/manchui.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manchui.shop/privkey.pem;

    # 요청 본문 크기 제한 설정
    client_max_body_size 10M;

    location / {
        proxy_pass http://blue; # 초기값은 Blue (필요 시 동적으로 Nginx 재구성)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;  # HTTP/1.1 사용 (WebSocket에 필수)
        proxy_set_header Upgrade $http_upgrade;  # Upgrade 헤더 전달
        proxy_set_header Connection "Upgrade";  # Connection 헤더 전달
    }

    # SSE 전용 endpoint: /api/notifications/subscribe
    location /api/notifications/subscribe {
            proxy_pass http://green;  # Blue나 Green으로 CD 때 sed 치환

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_buffering off;

            proxy_cache off;
            proxy_read_timeout 3600;  # 1시간
        }
}
